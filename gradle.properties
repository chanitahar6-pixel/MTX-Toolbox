org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true
android.useAndroidX=true
android.nonTransitiveRClass=true

# ---------------------------------------------------------------------------
# Native (C++/NDK) build switch.
#
# false = Gradle skips Android.mk entirely and the app runs on the pure-Java
#         engines in app.mtx.toolbox.core.Java*. This is the setting that lets
#         the project build inside AndroidIDE on the phone, where no NDK exists.
#
# true  = Gradle builds libmtxcore.so from src/main/cpp/Android.mk with ndk-build.
#         Use this on a desktop with an NDK installed, or in CI:
#             ./gradlew :app:assembleDebug -Pmtx.nativeBuild=true
#
# The app behaves identically either way: Native dispatches to the C++ core when
# libmtxcore.so is present and to the Java engines when it is not.
# ---------------------------------------------------------------------------
mtx.nativeBuild=false
