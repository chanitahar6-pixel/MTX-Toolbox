name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Exactly what AndroidIDE does on the phone: no NDK, Java engines only.
  java-only:
    name: Java-only APK (AndroidIDE parity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Assemble debug
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mtx-toolbox-debug-java
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # Full build with the C++ core compiled by ndk-build from Android.mk.
  native:
    name: Native APK (ndk-build / Android.mk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager --install "ndk;26.1.10909125"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Assemble debug with the native core
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.1.10909125
        run: gradle :app:assembleDebug -Pmtx.nativeBuild=true --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mtx-toolbox-debug-native
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
